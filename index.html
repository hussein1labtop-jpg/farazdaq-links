<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معهد الفرزدق | حسابات الأساتذة</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e2740;
    --navy-deep:#141a2c;
    --gold:#a3925f;
    --gold-light:#c7b98c;
    --cream:#f6f1e6;
    --cream-soft:#efe8d8;
    --line: rgba(30,39,64,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Tajawal', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(163,146,95,0.10), transparent 60%),
      var(--cream);
    color:var(--navy);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 60px;
  }

  /* ===== شعار المعهد ورأس الصفحة ===== */
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:420px;
    width:100%;
  }
  .logo-wrap{
    width:132px; height:132px;
    border-radius:26px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 10px 30px rgba(30,39,64,0.18), 0 0 0 1px rgba(30,39,64,0.06);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-wrap img{width:100%; height:100%; object-fit:contain;}
  .brand h1{
    margin-top:18px;
    font-size:26px;
    font-weight:900;
    letter-spacing:0.5px;
  }
  .brand .sub{
    margin-top:4px;
    font-size:13.5px;
    color:var(--gold);
    font-weight:700;
    letter-spacing:0.5px;
  }

  .admin-line{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--navy);
    color:var(--cream);
    padding:9px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    direction:ltr;
    text-decoration:none;
    box-shadow:0 6px 18px rgba(30,39,64,0.25);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .admin-line:hover, .admin-line:active{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(30,39,64,0.32);
  }
  .admin-line .icon{font-size:15px; direction:rtl;}

  /* ===== الخط الفاصل ===== */
  .divider{
    width:100%; max-width:420px;
    display:flex; align-items:center; gap:12px;
    margin:28px 0 22px;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider .diamond{
    width:9px; height:9px;
    background:var(--gold);
    transform:rotate(45deg);
    flex:none;
  }

  /* ===== قائمة الحسابات ===== */
  .accounts{
    width:100%; max-width:420px;
    display:flex; flex-direction:column;
    gap:12px;
  }
  .card{
    display:flex;
    align-items:center;
    gap:14px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:11px 14px;
    text-decoration:none;
    color:var(--navy);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    position:relative;
  }
  .card:hover, .card:active{
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(30,39,64,0.14);
    border-color:rgba(163,146,95,0.55);
  }
  .card.institute{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--cream);
    border-color:var(--navy);
  }
  .avatar{
    width:52px; height:52px;
    border-radius:50%;
    flex:none;
    overflow:hidden;
    background:var(--cream-soft);
    border:2px solid var(--gold-light);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .card.institute .avatar{border-color:var(--gold);}
  .name-wrap{flex:1; min-width:0;}
  .name{
    font-size:15.5px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .role{
    font-size:12px;
    color:var(--gold);
    font-weight:500;
    margin-top:2px;
  }
  .card.institute .role{color:var(--gold-light);}
  .arrow{
    flex:none;
    font-size:18px;
    opacity:.55;
  }

  /* ===== تذييل: إضافة حسابات ===== */
  .footnote{
    margin-top:26px;
    font-size:12.5px;
    color:#6b6455;
    text-align:center;
    max-width:420px;
    line-height:1.9;
  }
  .footnote a{
    color:#2f5fbf;
    font-weight:700;
    text-decoration:none;
  }
  .footnote a:hover{text-decoration:underline;}
</style>
</head>
<body>

  <div class="brand">
    <div class="logo-wrap"><img src="logo.jpg" alt="شعار معهد الفرزدق"></div>
    <h1>معهد الفرزدق</h1>
    <div class="sub">FARAZDAQ INSTITUTE</div>
    <a class="admin-line" href="https://wa.me/9647733697708" target="_blank" rel="noopener">
      <span class="icon">📞</span>
      <span>إدارة المعهد — 07733697708</span>
    </a>
  </div>

  <div class="divider"><span class="diamond"></span></div>

  <div class="accounts" id="accounts"></div>

  <div class="footnote">
    لإضافة حسابك ضمن هذه الصفحة تواصل مع إدارة الصفحة
    <br>
    <a href="https://www.instagram.com/huha_2007" target="_blank" rel="noopener">huha_2007</a>
  </div>

<script>
/* ============================================================
   قائمة الحسابات — لإضافة حساب جديد أضف سطراً هنا بنفس الشكل
   name    : اسم الأستاذ كما يظهر بالبطاقة
   role    : نص فرعي صغير (اختياري، اتركه "" إن لم يلزم)
   username: يوزر الانستغرام (بدون @) — يستخدم فقط للرابط
   photo   : اسم ملف صورة البروفايل (ترفعه يدوياً بجذر المستودع)
   institute: true فقط لحساب المعهد نفسه (أول بطاقة)
   ============================================================ */
const accounts = [
  { name: "معهد الفرزدق",        role: "الحساب الرسمي",     username: "fsc.2017",        photo: "fsc_2017.jpg", institute: true },
  { name: "الأستاذ حسين النجار",  role: "",                  username: "hu.alnajjar",     photo: "hu_alnajjar.jpg" },
  { name: "الأستاذ طه حسين",      role: "",                  username: "taha.alassady",   photo: "taha_alassady.jpg" },
  { name: "الأستاذ حيدر الحسناوي", role: "",                 username: "haider_math",     photo: "haider_math.jpg" },
  { name: "الأستاذ عبد الأمير الموسوي", role: "",            username: "abdal_amir11",    photo: "abdal_amir11.jpg" },
  { name: "الأستاذ أوس الجيلاوي", role: "",                  username: "aws.aljelawy",    photo: "aws_aljelawy.jpg" },
  { name: "الأستاذ حسام وساف",    role: "",                  username: "hu.wassaf",       photo: "hu_wassaf.jpg" },
  { name: "الأستاذ إيهاب العبيدي", role: "",                 username: "ihab.alabiedi.3", photo: "ihab_alabiedi.jpg" },
  { name: "الأستاذ خليل كامل",    role: "",                  username: "n2k.y",           photo: "n2k_y.jpg" },
  { name: "الأستاذ علاء المعموري", role: "",                 username: "91_alaa_",        photo: "alaa_91.jpg" },
  { name: "الأستاذ نبيل السيلاوي", role: "",                 username: "nabeelassilawi",  photo: "nabeelassilawi.jpg" },
];

const wrap = document.getElementById("accounts");
accounts.forEach(acc => {
  const a = document.createElement("a");
  a.className = "card" + (acc.institute ? " institute" : "");
  a.href = `https://www.instagram.com/${acc.username}`;
  a.target = "_blank";
  a.rel = "noopener";

  a.innerHTML = `
    <div class="avatar">
      <img src="${acc.photo}"
           alt="${acc.name}" loading="lazy"
           onerror="this.src='logo.jpg'">
    </div>
    <div class="name-wrap">
      <div class="name">${acc.name}</div>
      ${acc.role ? `<div class="role">${acc.role}</div>` : ""}
    </div>
    <div class="arrow">‹</div>
  `;
  wrap.appendChild(a);
});
</script>
</body>
</html>
