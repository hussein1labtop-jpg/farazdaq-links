<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معهد الفرزدق | حسابات الأساتذة</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e2740;
    --navy-deep:#141a2c;
    --gold:#a3925f;
    --gold-light:#c7b98c;
    --cream:#f6f1e6;
    --cream-soft:#efe8d8;
    --line: rgba(30,39,64,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Tajawal', sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, rgba(163,146,95,0.10), transparent 60%),
      var(--cream);
    color:var(--navy);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 60px;
  }

  /* ===== شعار المعهد ورأس الصفحة ===== */
  .brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:420px;
    width:100%;
  }
  .logo-wrap{
    width:132px; height:132px;
    border-radius:26px;
    overflow:hidden;
    background:#fff;
    box-shadow:0 10px 30px rgba(30,39,64,0.18), 0 0 0 1px rgba(30,39,64,0.06);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-wrap img{width:100%; height:100%; object-fit:contain;}
  .brand h1{
    margin-top:18px;
    font-size:26px;
    font-weight:900;
    letter-spacing:0.5px;
  }
  .brand .sub{
    margin-top:4px;
    font-size:13.5px;
    color:var(--gold);
    font-weight:700;
    letter-spacing:0.5px;
  }

  .admin-line{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--navy);
    color:var(--cream);
    padding:9px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    direction:ltr;
    text-decoration:none;
    box-shadow:0 6px 18px rgba(30,39,64,0.25);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .admin-line:hover, .admin-line:active{
    transform:translateY(-2px);
    box-shadow:0 10px 22px rgba(30,39,64,0.32);
  }
  .admin-line .icon{font-size:15px; direction:rtl;}

  /* ===== الخط الفاصل ===== */
  .divider{
    width:100%; max-width:420px;
    display:flex; align-items:center; gap:12px;
    margin:28px 0 22px;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider .diamond{
    width:9px; height:9px;
    background:var(--gold);
    transform:rotate(45deg);
    flex:none;
  }

  /* ===== بطاقة حساب المعهد (خارج الحقول) ===== */
  .institute-wrap{
    width:100%; max-width:420px;
    margin-bottom:26px;
  }

  /* ===== حقول المواد ===== */
  .subjects{
    width:100%; max-width:420px;
    display:flex; flex-direction:column;
    gap:12px;
  }
  .subject-field{
    border-radius:20px;
    padding:14px 14px 14px;
    border:1.5px solid var(--field-color, var(--gold));
    background: color-mix(in srgb, var(--field-color, var(--gold)) 7%, #fff);
    position:relative;
  }
  .subject-title{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--field-color, var(--gold));
    color:#fff;
    font-weight:900;
    font-size:14px;
    padding:5px 15px;
    border-radius:999px;
    margin-bottom:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.12);
  }
  .subject-cards{
    display:flex; flex-direction:column; gap:10px;
  }

  /* ===== بطاقة حساب ===== */
  .card{
    display:flex;
    align-items:center;
    gap:14px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:16px;
    padding:11px 14px;
    text-decoration:none;
    color:var(--navy);
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    position:relative;
  }
  .card:hover, .card:active{
    transform:translateY(-2px);
    box-shadow:0 12px 24px rgba(30,39,64,0.14);
    border-color:rgba(163,146,95,0.55);
  }
  .card.institute{
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--cream);
    border-color:var(--navy);
  }
  .avatar{
    width:52px; height:52px;
    border-radius:50%;
    flex:none;
    overflow:hidden;
    background:var(--cream-soft);
    border:2px solid var(--gold-light);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar img{width:100%; height:100%; object-fit:cover;}
  .card.institute .avatar{border-color:var(--gold);}
  .name-wrap{flex:1; min-width:0;}
  .name{
    font-size:15.5px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .role{
    font-size:11.5px;
    font-weight:700;
    margin-top:3px;
    display:inline-block;
    padding:2px 10px;
    border-radius:999px;
  }
  .role.role-teacher{
    background:rgba(30,39,64,0.10);
    color:var(--navy);
  }
  .role.role-assistant{
    background:rgba(163,146,95,0.18);
    color:#8a723f;
  }
  .card.institute .role{
    background:rgba(255,255,255,0.15);
    color:var(--gold-light);
  }
  .arrow{
    flex:none;
    font-size:18px;
    opacity:.55;
  }

  /* ===== تذييل: إضافة حسابات ===== */
  .footnote{
    margin-top:30px;
    font-size:12.5px;
    color:#6b6455;
    text-align:center;
    max-width:420px;
    line-height:1.9;
  }
  .footnote a{
    color:#2f5fbf;
    font-weight:700;
    text-decoration:none;
  }
  .footnote a:hover{text-decoration:underline;}
</style>
</head>
<body>

  <div class="brand">
    <div class="logo-wrap"><img src="logo.jpg" alt="شعار معهد الفرزدق"></div>
    <h1>معهد الفرزدق</h1>
    <div class="sub">FARAZDAQ INSTITUTE</div>
    <a class="admin-line" href="https://wa.me/9647733697708" target="_blank" rel="noopener">
      <span class="icon">📞</span>
      <span>إدارة المعهد — 07733697708</span>
    </a>
  </div>

  <div class="divider"><span class="diamond"></span></div>

  <div class="institute-wrap" id="institute-wrap"></div>

  <div class="subjects" id="subjects"></div>

  <div class="footnote">
    لإضافة حسابك ضمن هذه الصفحة تواصل مع إدارة الصفحة
    <br>
    <a href="https://www.instagram.com/huha_2007" target="_blank" rel="noopener">huha_2007</a>
  </div>

<script>
/* ============================================================
   حساب المعهد الرسمي — يبقى دائماً بالأعلى خارج حقول المواد
   ============================================================ */
const instituteAccount = {
  name: "معهد الفرزدق", roleLabel: "الحساب الرسمي",
  username: "fsc.2017", photo: "fsc_2017.jpg"
};

/* ============================================================
   المواد — كل مدرس إله صندوق (حقل) خاص بيه، وأي مساعد تابع
   إله يندرج بداخل نفس صندوق ذلك المدرس (بقائمة accounts).
   لإضافة مساعد جديد لمدرس موجود: أضف سطراً بقائمة accounts
   الخاصة فيه بنفس الشكل (بعد سطر المدرس مباشرة أفضل).
   لإضافة مدرس جديد كلياً: انسخ كتلة { title, color, accounts:[...] }
   وحطها بالمكان المناسب، وغيّر العنوان واللون والحسابات.
   role تكون "أستاذ" أو "مساعد" فقط — وتتحكم بلون شارة الدور بالبطاقة
   ============================================================ */
const subjects = [
  { title: "مادة الكيمياء", color: "#2f7d5f", accounts: [
      { name: "الأستاذ حسين النجار", role: "أستاذ", username: "hu.alnajjar", photo: "hu_alnajjar.jpg" },
      { name: "يوميات دفعة 27 للأستاذ حسين النجار", role: "مساعد", username: "team.alnajjar", photo: "team_alnajjar.jpg" },
      { name: "تجمع طلاب الأستاذ حسين النجار", role: "مساعد", username: "alnaj_jarr", photo: "alnaj_jarr.jpg" },
  ]},
  { title: "مادة الكيمياء", color: "#2f7d5f", accounts: [
      { name: "الأستاذ خليل كامل", role: "أستاذ", username: "n2k.y", photo: "n2k_y.jpg" },
  ]},

  { title: "مادة الإنكليزي", color: "#2f5fbf", accounts: [
      { name: "الأستاذ طه حسين", role: "أستاذ", username: "taha.alassady", photo: "taha_alassady.jpg" },
  ]},
  { title: "مادة الإنكليزي", color: "#2f5fbf", accounts: [
      { name: "الأستاذ نبيل السيلاوي", role: "أستاذ", username: "nabeelassilawi", photo: "nabeelassilawi.jpg" },
  ]},
  { title: "مادة الإنكليزي", color: "#2f5fbf", accounts: [
      { name: "الأستاذ إيهاب العبيدي", role: "أستاذ", username: "ihab.alabiedi.3", photo: "ihab_alabiedi.jpg" },
      { name: "تجمع طلاب الأستاذ إيهاب العبيدي", role: "مساعد", username: "_mr._ehab_alabiedi", photo: "mr_ehab_alabiedi.jpg" },
  ]},

  { title: "مادة الفيزياء", color: "#7a4fc9", accounts: [
      { name: "الأستاذ أوس الجيلاوي", role: "أستاذ", username: "aws.aljelawy", photo: "aws_aljelawy.jpg" },
  ]},

  { title: "مادة الرياضيات", color: "#c07a1f", accounts: [
      { name: "الأستاذ حيدر الحسناوي", role: "أستاذ", username: "haider_math", photo: "haider_math.jpg" },
      { name: "اليسر في الرياضيات | الأستاذ حيدر الحسناوي", role: "مساعد", username: "haiderxmath", photo: "haiderxmath.jpg" },
  ]},
  { title: "مادة الرياضيات", color: "#c07a1f", accounts: [
      { name: "الأستاذة مها الطائي", role: "أستاذ", username: "ma_.ha995", photo: "ma_ha995.jpg" },
      { name: "قمة النجاح | الست مها الطائي", role: "مساعد", username: "z__f__m_", photo: "z__f__m_.jpg" },
      { name: "تجمع طلاب الست مها الطائي", role: "مساعد", username: "al_tai95", photo: "al_tai95.jpg" },
  ]},
  { title: "مادة الرياضيات", color: "#c07a1f", accounts: [
      { name: "الأستاذ علاء المعموري", role: "أستاذ", username: "91_alaa_", photo: "alaa_91.jpg" },
  ]},

  { title: "مادة العربي", color: "#a83c3c", accounts: [
      { name: "الأستاذ عبد الأمير الموسوي", role: "أستاذ", username: "abdal_amir11", photo: "abdal_amir11.jpg" },
      { name: "تجمع طلاب الأستاذ عبد الأمير الموسوي", role: "مساعد", username: "abdalamer39", photo: "abdalamer39.jpg" },
  ]},

  { title: "مادة الأحياء", color: "#3f9b3f", accounts: [
      { name: "الأستاذ حسام وساف", role: "أستاذ", username: "hu.wassaf", photo: "hu_wassaf.jpg" },
      { name: "تجمع طلاب الأستاذ حسام وساف", role: "مساعد", username: "h_2026s", photo: "h_2026s.jpg" },
  ]},
];

function buildCard(acc, isInstitute){
  const a = document.createElement("a");
  a.className = "card" + (isInstitute ? " institute" : "");
  a.href = `https://www.instagram.com/${acc.username}`;
  a.target = "_blank";
  a.rel = "noopener";

  const roleClass = acc.role === "مساعد" ? "role-assistant" : "role-teacher";
  const roleText = isInstitute ? acc.roleLabel : acc.role;

  a.innerHTML = `
    <div class="avatar">
      <img src="${acc.photo}"
           alt="${acc.name}" loading="lazy"
           onerror="this.src='logo.jpg'">
    </div>
    <div class="name-wrap">
      <div class="name">${acc.name}</div>
      ${roleText ? `<span class="role ${roleClass}">${roleText}</span>` : ""}
    </div>
    <div class="arrow">‹</div>
  `;
  return a;
}

/* حساب المعهد بالأعلى */
document.getElementById("institute-wrap").appendChild(buildCard(instituteAccount, true));

/* بناء حقول المواد — صندوق واحد لكل مدرس، ومساعديه بداخل نفس الصندوق */
const subjectsWrap = document.getElementById("subjects");
subjects.forEach(entry => {
  const field = document.createElement("div");
  field.className = "subject-field";
  field.style.setProperty("--field-color", entry.color);

  const title = document.createElement("div");
  title.className = "subject-title";
  title.textContent = entry.title;
  field.appendChild(title);

  const cardsWrap = document.createElement("div");
  cardsWrap.className = "subject-cards";
  entry.accounts.forEach(acc => cardsWrap.appendChild(buildCard(acc, false)));
  field.appendChild(cardsWrap);

  subjectsWrap.appendChild(field);
});
</script>
</body>
</html>
